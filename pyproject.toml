[project]
name = "deck"
version = "0.1.0"
description = "YAML-configured daemon for an Elgato Stream Deck + XL"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "streamdeck>=0.10.0",
    "pillow",
    "pydantic>=2",
    "pyyaml",
    "websockets",
]

[project.scripts]
deck = "deck.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deck"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
